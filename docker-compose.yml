services:
  api:
    build:
      context: ${MPC_API_PATH:-../mypetcare_api}
      dockerfile: ../mpc-docker/docker/api/Dockerfile
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${MPC_VET_PATH:-../mpc_frontend}:/app/vet:ro
      - ${MPC_ADMIN_PATH:-../admin_mpc}:/app/admin:ro
      - ${MPC_CLIENTES_PATH:-../mpc_clientes}:/app/clientes
    environment:
      - API_URL=http://api:5000
      - VET_API_URL=${VET_API_URL:-http://localhost/api}
      - VET_SUPABASE_URL=${VET_SUPABASE_URL}
      - VET_SUPABASE_ANON_KEY=${VET_SUPABASE_ANON_KEY}
      - ADMIN_API_URL=${ADMIN_API_URL:-http://localhost/api}
      - ADMIN_SUPABASE_URL=${ADMIN_SUPABASE_URL}
      - ADMIN_SUPABASE_ANON_KEY=${ADMIN_SUPABASE_ANON_KEY}
      - CLIENTES_API_URL=${CLIENTES_API_URL:-http://localhost/api}
    restart: unless-stopped

server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de upload (imágenes de logos, etc.)
    client_max_body_size 10M;

    # ========================================================================
    # Frontend: Veterinario (vet)
    # ========================================================================
    location /vet/ {
        alias /usr/share/nginx/html/vet/;
        try_files $uri $uri/ /vet/index.html;

        # Cache para assets estáticos
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================================================
    # Frontend: Admin
    # ========================================================================
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================================================
    # Frontend: Clientes
    # ========================================================================
    location /clientes/ {
        alias /usr/share/nginx/html/clientes/;
        try_files $uri $uri/ /clientes/index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================================================
    # API → Proxy a Flask (gunicorn)
    # ========================================================================
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout para requests lentos (Render cold start simulation)
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ========================================================================
    # Redirect raíz → /admin/
    # ========================================================================
    location = / {
        return 302 /admin/;
    }

    # ========================================================================
    # Healthcheck del propio Nginx
    # ========================================================================
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
